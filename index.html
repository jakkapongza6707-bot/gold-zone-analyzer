<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Zone Analyzer Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #242424 0%, #0d0d0d 45%, #050505 100%);
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 38px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
      margin-top: 8px;
      font-size: 14px;
    }

    .panel {
      background: rgba(25,25,25,.88);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .price-box {
      background: linear-gradient(135deg,#171717,#242424);
      border: 1px solid #8f701e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .price-label {
      color: #999;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .price-input {
      font-size: 34px !important;
      font-weight: 700;
      text-align: center;
      color: #f5c84b !important;
      border: none !important;
      background: transparent !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      color: #999;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d6a928;
      box-shadow: 0 0 0 3px rgba(214,169,40,.12);
    }

    .analyze-btn,
    #runBacktestBtn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg,#f2c94c,#b8860b);
      color: #111;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    #clearDataBtn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #151515;
      color: #999;
      font-size: 14px;
      cursor: pointer;
    }

    .file-box {
      border: 1px dashed #555;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      background: #111;
      margin-bottom: 15px;
    }

    #backtestFile {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      background: #181818;
      border-radius: 10px;
    }

    .file-name {
      color: #aaa;
      font-size: 12px;
      margin-top: 8px;
    }

    .results {
      margin-top: 20px;
    }

    .stats-grid,
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .stat-card,
    .feature-card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 14px;
    }

    .feature-label {
      color: #888;
      font-size: 10px;
      font-weight: 800;
    }

    .feature-value {
      font-size: 18px;
      font-weight: 800;
      margin-top: 5px;
    }

    .win {
      color: #43d17a;
    }

    .loss {
      color: #ff5b5b;
    }

    .nearest-info {
      color: #888;
      font-size: 11px;
      line-height: 1.7;
      margin-top: 6px;
    }

    .backtest-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 11px;
    }

    .backtest-table th,
    .backtest-table td {
      border-bottom: 1px solid #292929;
      padding: 8px 5px;
      text-align: left;
    }

    .backtest-table th {
      color: #888;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 30px;
    }

    @media(max-width:650px) {
      .container {
        padding: 18px 12px 40px;
      }

      h1 {
        font-size: 25px;
      }

      .grid,
      .stats-grid,
      .analysis-grid {
        grid-template-columns: 1fr;
      }

      .price-input {
        font-size: 30px !important;
      }

      .backtest-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🥇</div>
    <h1>Gold Zone Analyzer Pro</h1>
    <div class="subtitle">
      XAUUSD • Statistical Volatility Analysis
    </div>
  </div>

  <!-- CURRENT PRICE -->

  <div class="price-box">

    <div class="price-label">
      CURRENT GOLD PRICE
    </div>

    <input
      class="price-input"
      type="number"
      id="price"
      placeholder="4616"
    >

  </div>

  <!-- D1 -->

  <div class="panel">

    <div class="panel-title">
      📅 D1 Market Data
    </div>

    <div class="grid">

      <div class="field">
        <label>MA12</label>
        <input
          type="number"
          id="d1ma12"
          placeholder="4418.6869"
        >
      </div>

      <div class="field">
        <label>ATR14</label>
        <input
          type="number"
          id="d1atr"
          placeholder="91.657"
        >
      </div>

      <div class="field">
        <label>SD20</label>
        <input
          type="number"
          id="d1sd"
          placeholder="160.7930"
        >
      </div>

      <div class="field">
        <label>MA247</label>
        <input
          type="number"
          id="d1ma247"
          placeholder="Optional"
        >
      </div>

    </div>

  </div>

  <!-- W1 -->

  <div class="panel">

    <div class="panel-title">
      📊 W1 Market Data
    </div>

    <div class="grid">

      <div class="field">
        <label>MA12</label>
        <input
          type="number"
          id="w1ma12"
          placeholder="4210.2075"
        >
      </div>

      <div class="field">
        <label>ATR14</label>
        <input
          type="number"
          id="w1atr"
          placeholder="226.111"
        >
      </div>

      <div class="field">
        <label>SD20</label>
        <input
          type="number"
          id="w1sd"
          placeholder="260.7582"
        >
      </div>

    </div>

  </div>

  <!-- ANALYZE -->

  <button class="analyze-btn">
    🔍 วิเคราะห์ Gold Zones
  </button>

  <button id="clearDataBtn">
    🧹 ล้างข้อมูลที่บันทึกไว้
  </button>


  <!-- BACKTEST -->

  <div class="panel">

    <div class="panel-title">
      🧪 Backtest
    </div>

    <div class="file-box">

      <strong>
        📁 เลือกไฟล์ข้อมูลย้อนหลัง
      </strong>

      <input
        type="file"
        id="backtestFile"
        accept=".csv,text/csv"
      >

      <div
        id="backtestFileName"
        class="file-name"
      >
        ยังไม่ได้เลือกไฟล์
      </div>

    </div>


    <div class="grid">

      <div class="field">

        <label>
          Minimum Strength
        </label>

        <input
          type="number"
          id="minStrength"
          value="60"
          min="0"
          max="100"
        >

      </div>


      <div class="field">

        <label>
          Risk (R)
        </label>

        <input
          type="number"
          id="riskR"
          value="1"
          step="0.1"
          min="0.1"
        >

      </div>


      <div class="field">

        <label>
          Reward (R)
        </label>

        <input
          type="number"
          id="rewardR"
          value="2"
          step="0.1"
          min="0.1"
        >

      </div>

    </div>


    <button id="runBacktestBtn">
      🚀 เริ่ม Backtest
    </button>


    <div id="backtestResults"></div>

  </div>


  <!-- RESULTS -->

  <div id="results">

    <div id="marketAnalysis"></div>

  </div>


  <div class="footer">
    Gold Zone Analyzer Pro • XAUUSD Quantitative Tool
  </div>

</div>


<script src="script.js?v=6"></script>

<script>

  const fileInput =
    document.getElementById("backtestFile");

  const fileName =
    document.getElementById("backtestFileName");


  fileInput.addEventListener(
    "change",
    function() {

      if (!this.files.length) {

        fileName.textContent =
          "ยังไม่ได้เลือกไฟล์";

        return;

      }

      fileName.textContent =
        "ไฟล์ที่เลือก: " +
        this.files[0].name;

    }
  );


  document
    .getElementById("runBacktestBtn")
    .addEventListener(
      "click",
      async function() {

        const file =
          fileInput.files[0];

        if (!file) {

          alert(
            "กรุณาเลือกไฟล์ CSV ก่อนครับ"
          );

          return;

        }

        try {

          const text =
            await file.text();


          /*
           * ส่งข้อมูล CSV เข้า textarea
           * ที่ script.js เดิมต้องการ
           */

          let textarea =
            document.getElementById(
              "backtestData"
            );


          if (!textarea) {

            textarea =
              document.createElement(
                "textarea"
              );

            textarea.id =
              "backtestData";

            textarea.style.display =
              "none";

            document.body.appendChild(
              textarea
            );

          }


          textarea.value =
            text;


          /*
           * ให้ script.js เดิมทำงาน
           */

          textarea.dispatchEvent(
            new Event("change")
          );

        } catch(error) {

          alert(
            "อ่านไฟล์ไม่สำเร็จ\n\n" +
            error.message
          );

        }

      }
    );

</script>

</body>
</html>

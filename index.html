<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analysis & Trading Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Results Display */
        #results {
            display: none; /* ซ่อนไว้ก่อน พอกดวิเคราะห์ค่อยเปิด */
        }

        .zone-display-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .zone-box {
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .support-box {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success-color);
        }

        .resistance-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger-color);
        }

        .zone-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* Loading Spinner Animation */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Market Scanner Window */
        #marketScanner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            padding: 20px;
        }

        /* Quick Scroll Controls */
        .scroll-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 500;
        }

        .scroll-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Form Section -->
        <div class="card">
            <h2>กำหนดค่าและโซนราคาตลาด</h2>
            <form id="analysisForm" onsubmit="event.preventDefault(); handleAnalyze();">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="symbolInput">สัญลักษณ์ / คู่เงิน (Symbol):</label>
                        <input type="text" id="symbolInput" placeholder="เช่น EUR/USD, BTCUSDT" required>
                    </div>
                    <div class="form-group">
                        <label for="supportInput">แนวรับ (Support Zone):</label>
                        <input type="number" step="any" id="supportInput" placeholder="ระบุราคาแนวรับ" required>
                    </div>
                    <div class="form-group">
                        <label for="resistanceInput">แนวต้าน (Resistance Zone):</label>
                        <input type="number" step="any" id="resistanceInput" placeholder="ระบุราคาแนวต้าน" required>
                    </div>
                </div>
                <button type="submit" id="btnAnalyze">วิเคราะห์ / ค้นหา</button>
            </form>
        </div>

        <!-- Results Section -->
        <div id="results" class="card">
            <h2>ผลการวิเคราะห์โซนราคาตลาด</h2>
            <div id="symbolDisplay" style="font-size: 18px; color: var(--accent-color); font-weight: bold;"></div>
            
            <div class="zone-display-container">
                <div class="zone-box support-box">
                    <h3>โซนแนวรับ (Support)</h3>
                    <div id="displaySupport" class="zone-value">-</div>
                </div>
                <div class="zone-box resistance-box">
                    <h3>โซนแนวต้าน (Resistance)</h3>
                    <div id="displayResistance" class="zone-value">-</div>
                </div>
            </div>

            <div id="backtestResults" style="margin-top: 20px;"></div>
            <div id="historyResults" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Scanner Window -->
    <div id="marketScanner">
        <h3>Market Scanner</h3>
        <p>กำลังค้นหารูปแบบราคาและสแกนตลาด...</p>
        <button onclick="toggleScanner(false)">ปิด</button>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: var(--text-color);">กำลังวิเคราะห์และประมวลผลโซนราคา...</p>
    </div>

    <!-- Quick Scroll Buttons -->
    <div class="scroll-buttons">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">▼</button>
    </div>

    <!-- External Scripts -->
    <script src="script.js"></script>
    <script src="history.js"></script>

    <!-- Main Controller Script -->
    <script>
        // ฟังก์ชันเมื่อกดปุ่มวิเคราะห์ / ค้นหา
        function handleAnalyze() {
            // 1. แสดง Loading Animation
            showLoading();

            // 2. จำลองการดึงและประมวลผลข้อมูล
            setTimeout(() => {
                const symbol = document.getElementById('symbolInput')?.value;
                const support = document.getElementById('supportInput')?.value;
                const resistance = document.getElementById('resistanceInput')?.value;

                // 3. แสดงผลโซนราคาที่กรอกลงใน UI
                renderMarketZones(symbol, support, resistance);

                // 4. ซ่อน Loading Animation
                hideLoading();

                // 5. เลื่อนหน้าจอลงมาดูผลลัพธ์
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            }, 600); // ระยะเวลาโหลด 0.6 วินาที
        }

        // เปิด/ปิด Loading Overlay
        function showLoading() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) loader.style.display = 'flex';
        }

        function hideLoading() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) loader.style.display = 'none';
        }

        // แสดงผลโซนราคาตลาด
        function renderMarketZones(symbol, support, resistance) {
            const resultsContainer = document.getElementById('results');
            if (resultsContainer) {
                resultsContainer.style.display = 'block'; // เปิดให้แสดงผลกล่องผลลัพธ์
            }

            const symbolElem = document.getElementById('symbolDisplay');
            const supportElem = document.getElementById('displaySupport');
            const resistanceElem = document.getElementById('displayResistance');

            if (symbolElem) symbolElem.innerText = `Symbol: ${symbol || 'N/A'}`;
            if (supportElem) supportElem.innerText = support ? Number(support).toLocaleString() : '-';
            if (resistanceElem) resistanceElem.innerText = resistance ? Number(resistance).toLocaleString() : '-';
        }

        // ควบคุม Market Scanner Window
        function toggleScanner(show) {
            const scanner = document.getElementById('marketScanner');
            if (scanner) {
                scanner.style.display = show ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>

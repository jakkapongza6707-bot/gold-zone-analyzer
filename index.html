<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Zone Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #242424 0%, #0d0d0d 45%, #050505 100%);
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 38px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #999;
      margin-top: 8px;
      font-size: 14px;
    }

    .panel {
      background: rgba(25, 25, 25, 0.88);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .price-box {
      background: linear-gradient(135deg, #171717, #242424);
      border: 1px solid #8f701e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .price-label {
      color: #999;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .price-input {
      font-size: 34px !important;
      font-weight: 700;
      text-align: center;
      color: #f5c84b !important;
      border: none !important;
      background: transparent !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      color: #999;
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #d6a928;
      box-shadow: 0 0 0 3px rgba(214,169,40,0.12);
    }

    .analyze-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #f2c94c, #b8860b);
      color: #111;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 8px 25px rgba(214,169,40,0.18);
      transition: 0.2s;
    }

    .analyze-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .results {
      margin-top: 20px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .result-count {
      color: #888;
      font-size: 12px;
    }

    .zone {
      padding: 15px;
      margin: 9px 0;
      border-radius: 13px;
      background: #151515;
      border: 1px solid #292929;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .zone-main {
      min-width: 0;
    }

    .zone-name {
      font-weight: 700;
      font-size: 14px;
    }

    .zone-price {
      color: #f2c94c;
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
    }

    .zone-distance {
      text-align: right;
      font-size: 12px;
      color: #999;
      white-space: nowrap;
    }

    .above {
      border-left: 4px solid #3fa7ff;
    }

    .below {
      border-left: 4px solid #ff5b5b;
    }

    .direction-above {
      color: #55b8ff;
    }

    .direction-below {
      color: #ff6868;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 30px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 18px 12px 40px;
      }

      h1 {
        font-size: 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .zone {
        padding: 13px;
      }

      .zone-price {
        font-size: 18px;
      }

      .price-input {
        font-size: 30px !important;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">🥇</div>
      <h1>Gold Zone Analyzer</h1>
      <div class="subtitle">
        XAUUSD • Statistical Volatility Analysis
      </div>
    </div>

    <div class="price-box">
      <div class="price-label">CURRENT GOLD PRICE</div>
      <input
        class="price-input"
        type="number"
        id="price"
        placeholder="4616"
      >
    </div>

    <div class="panel">

      <div class="panel-title">
        📅 D1 Market Data
      </div>

      <div class="grid">

        <div class="field">
          <label>MA12</label>
          <input type="number" id="d1ma12" placeholder="4418.6869">
        </div>

        <div class="field">
          <label>ATR14</label>
          <input type="number" id="d1atr" placeholder="91.657">
        </div>

        <div class="field">
          <label>SD20</label>
          <input type="number" id="d1sd" placeholder="160.7930">
        </div>

        <div class="field">
          <label>MA247</label>
          <input type="number" id="d1ma247" placeholder="Optional">
        </div>

      </div>

    </div>

    <div class="panel">

      <div class="panel-title">
        📊 W1 Market Data
      </div>

      <div class="grid">

        <div class="field">
          <label>MA12</label>
          <input type="number" id="w1ma12" placeholder="4210.2075">
        </div>

        <div class="field">
          <label>ATR14</label>
          <input type="number" id="w1atr" placeholder="226.111">
        </div>

        <div class="field">
          <label>SD20</label>
          <input type="number" id="w1sd" placeholder="260.7582">
        </div>

      </div>

    </div>

    <button class="analyze-btn">
      🔍 วิเคราะห์ Gold Zones
    </button>
    <button
  id="clearDataBtn"
  style="
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #333;
    border-radius:12px;
    background:#151515;
    color:#999;
    font-size:14px;
    cursor:pointer;
  "
>
  🧹 ล้างข้อมูลที่บันทึกไว้
</button>

    <div id="results"></div>

    <div class="footer">
      Gold Zone Analyzer • XAUUSD Quantitative Tool
    </div>

  </div>

<script src="script.js?v=3"></script>

</body>
</html>

</body>
